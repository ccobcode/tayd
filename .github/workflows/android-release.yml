name: Android Release APK

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to create or update (vMAJOR.MINOR.PATCH)
                required: true
                type: string

permissions:
    contents: write

jobs:
    release-apk:
        name: Build and publish APK
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25"

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "9.4.1"
                  cache-provider: basic

            - name: Install Android SDK components
              run: android/scripts/ci/install-sdk-components.sh

            - name: Build Android frpc binaries
              run: android/scripts/build-frpc.sh

            - name: Prepare signing key
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: android/scripts/ci/prepare-signing-key.sh

            - name: Test and build signed release APK
              run: gradle -p android :app:testDebugUnitTest :app:assembleRelease --no-daemon

            - name: Prepare release asset
              id: asset
              env:
                  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
              run: android/scripts/ci/prepare-release-asset.sh "$RELEASE_TAG"

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.asset.outputs.tag }}
                  ASSET: ${{ steps.asset.outputs.asset }}
                  ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
              run: android/scripts/ci/publish-github-release.sh
